name: Daily Porsche 987.2 Scrape & Deploy

on:
  schedule:
    # Runs daily at 11:00 AM UTC (6:00 AM EST)
    - cron: '0 11 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  scrape-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies & Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright jinja2
          playwright install chromium
          playwright install-deps

      - name: Run Pipeline
        run: |
          python scripts/init_db.py
          python scripts/scraper.py
          python scripts/evaluator.py
          python scripts/build_site.py

      - name: Commit and Push Updated Dashboard
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html data/listings.db
          git diff --quiet && git diff --staged --quiet || (git commit -m "auto: daily Porsche 987.2 scrape update [skip ci]" && git push)
